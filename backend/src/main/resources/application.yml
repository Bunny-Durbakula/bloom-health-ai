server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: bloom-health-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bloom_health_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta
  timeout-seconds: 45

jwt:
  secret: ${JWT_SECRET:BloomHealthAI_SuperSecret_Jwt_SigningKey_For_Dev_2026_Secure32Chars}
  expiration-ms: 86400000 # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    root: INFO
    com.bloomhealth: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
